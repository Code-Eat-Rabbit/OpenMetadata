# ============================================
# Test Case 04: Owner Existence Validation
# ============================================
# Test Scenario: Test validation when owner doesn't exist
# Expected Behavior:
#   Case 1: Valid owner exists
#     - finance_db → "finance-team" (VALID, exists)
#   
#   Case 2: Owner doesn't exist
#     - revenue table → "nonexistent-team" (should log WARNING, fallback to inherited/default)
#   
#   Case 3: Valid owner exists
#     - expenses table → "expense-team" (VALID, exists)
#
# Note: Modified for Pydantic 2.11.9 compatibility (single owner per entity)

source:
  type: postgres
  serviceName: postgres-test-04-validation
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration - Validation test cases
      ownerConfig:
        default: "data-platform-team"
        
        database:
          # Case 1: Valid team (should work)
          "finance_db": "finance-team"
        
        table:
          # Case 2: Nonexistent owner (should log WARNING and fallback)
          "finance_db.accounting.revenue": "nonexistent-team"
          
          # Case 3: Valid team (should work)
          "finance_db.accounting.expenses": "expense-team"
        
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"