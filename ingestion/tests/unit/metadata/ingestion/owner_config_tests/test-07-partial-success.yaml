# ============================================
# Test Case 07: Resilience to Missing Owners
# ============================================
# Test Scenario: Test ingestion resilience when some owners don't exist
# Expected Behavior:
#   - revenue table: Owner doesn't exist, should log WARNING and fallback to inherited/default
#     - Log: WARNING "Could not find owner: nonexistent-user-1"
#   - expenses table: Owner exists, should work normally (charlie)
#   - budgets table: Owner doesn't exist, should log WARNING and fallback
#     - Log: WARNING "Could not find owner: nonexistent-user-2"
#
# This test validates that ingestion continues when some owners are not found
#
# Note: Modified for Pydantic 2.11.9 compatibility (single owner per entity)

source:
  type: postgres
  serviceName: postgres-test-07-partial
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration - Resilience test
      ownerConfig:
        default: "data-platform-team"
        
        table:
          # Nonexistent owner (should log WARNING and fallback)
          "finance_db.accounting.revenue": "nonexistent-user-1"
          
          # Existing owner (should work)
          "finance_db.accounting.expenses": "charlie"
          
          # Another nonexistent owner (should log WARNING and fallback)
          "finance_db.accounting.budgets": "nonexistent-user-2"
        
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"