# ============================================
# Test Case 13: Complex Mixed Scenario
# ============================================
# 测试场景：综合测试 - 混合 FQN/简单名称/单个/多个/继承
# 预期结果：验证所有功能组合使用时是否正常工作

source:
  type: postgres
  serviceName: postgres-finance-test-13
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration - Complex Mixed
      ownerConfig:
        default: "data-platform-team"
        
        # Database 级别 - 单个 owner
        database:
          "finance_db": "finance-team"
        
        # Schema 级别 - 混合 FQN 和简单名称
        databaseSchema:
          "finance_db.accounting": ["accounting-team", "compliance-team"]  # FQN + 多 owner
          "treasury": "treasury-team"                                      # 简单名称 + 单 owner（测试 fallback）
        
        # Table 级别 - 全面混合
        table:
          # FQN 精确匹配 + 多 owner
          "finance_db.accounting.revenue": ["revenue-team", "finance-team", "audit-team"]
          
          # 简单名称匹配 + 单 owner（测试 fallback）
          "expenses": "expense-team"
          
          # FQN 精确匹配 + 单 owner
          "finance_db.treasury.cash_flow": "treasury-ops-team"
          
          # 简单名称匹配 + 多 owner（测试 fallback）
          "investments": ["investment-team", "treasury-team"]
        
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
