# ============================================
# Test Case 2: Hierarchical Owners
# ============================================
# 测试场景：为每个层级配置不同的 owner（string 格式）
# 预期结果：
#   - finance_db database → "finance-team"
#   - 所有 schemas → "schema-admin-team"  
#   - 所有 tables → "table-steward-team"

source:
  type: postgres
  serviceName: postgres-finance-test-02
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration
      ownerConfig:
        default: "data-platform-team"
        database: "finance-team"
        databaseSchema: "schema-admin-team"
        table: "table-steward-team"
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
