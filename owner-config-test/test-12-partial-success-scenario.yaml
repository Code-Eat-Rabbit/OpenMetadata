# ============================================
# Test Case 12: Partial Success Scenario (A1 Strategy)
# ============================================
# 测试场景：测试部分成功策略 - 某些 owner 存在，某些不存在
# 预期结果：
#   - revenue table 配置了 3 个 owners，假设只有 2 个存在
#   - 应该成功添加存在的 owners，跳过不存在的
#   - 日志中应该看到 WARNING: "Could not find owner: nonexistent-team"

source:
  type: postgres
  serviceName: postgres-finance-test-12
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration - Partial Success Test
      ownerConfig:
        default: "data-platform-team"
        
        table:
          # 混合存在和不存在的 owners 来测试部分成功策略
          "finance_db.accounting.revenue": 
            - "finance-team"           # 假设存在
            - "nonexistent-team-1"     # 假设不存在
            - "audit-team"             # 假设存在
          
          "finance_db.accounting.expenses":
            - "expense-team"           # 假设存在
            - "nonexistent-team-2"     # 假设不存在
            - "nonexistent-team-3"     # 假设不存在
            - "finance-team"           # 假设存在
        
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
