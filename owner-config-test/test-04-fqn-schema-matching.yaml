# ============================================
# Test Case 4: FQN Schema Matching
# ============================================
# 测试场景：使用 FQN 精确匹配 schema owners
# 预期结果：
#   - finance_db.accounting schema → "accounting-team"
#   - finance_db.treasury schema → "treasury-team"
#   - 其他 schemas → "data-platform-team"（default）

source:
  type: postgres
  serviceName: postgres-finance-test-04
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration
      ownerConfig:
        default: "data-platform-team"
        databaseSchema:
          "finance_db.accounting": "accounting-team"
          "finance_db.treasury": "treasury-team"
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
