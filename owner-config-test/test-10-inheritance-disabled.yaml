# ============================================
# Test Case 10: Inheritance Disabled
# ============================================
# 测试场景：测试禁用继承（enableInheritance: false）
# 预期结果：
#   - finance_db → "finance-team"
#   - accounting schema 没有配置 → "data-platform-team"（default，不继承）
#   - treasury schema → "treasury-team"
#   - revenue table 没有配置 → "data-platform-team"（default，不继承）
#   - expenses table → "expense-team"

source:
  type: postgres
  serviceName: postgres-finance-test-10
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration - Inheritance Disabled
      ownerConfig:
        default: "data-platform-team"
        
        database:
          "finance_db": "finance-team"
        
        databaseSchema:
          # accounting schema 没有配置，应该用 default 而非继承
          "finance_db.treasury": "treasury-team"
        
        table:
          # revenue 没有配置，应该用 default 而非继承
          "finance_db.accounting.expenses": "expense-team"
          "finance_db.treasury.investments": "investment-team"
        
        enableInheritance: false    # 禁用继承
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
