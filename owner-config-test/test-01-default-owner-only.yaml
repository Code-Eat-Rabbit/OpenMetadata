# ============================================
# Test Case 1: Default Owner Only
# ============================================
# 测试场景：只配置 default owner，所有实体都使用默认 owner
# 预期结果：所有 database/schema/table 都应该有 "data-platform-team" 作为 owner

source:
  type: postgres
  serviceName: postgres-finance-test-01
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration
      ownerConfig:
        default: "data-platform-team"
      
      # Other settings
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
