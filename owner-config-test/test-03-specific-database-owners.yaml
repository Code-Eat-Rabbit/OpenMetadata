# ============================================
# Test Case 3: Specific Database Owners
# ============================================
# 测试场景：为不同的 database 配置不同的 owner（dict 格式）
# 预期结果：
#   - finance_db → "finance-team"
#   - marketing_db → "marketing-team"（需要第二次 ingestion）
#   - 其他未配置的 databases → "data-platform-team"

source:
  type: postgres
  serviceName: postgres-test-03
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration
      ownerConfig:
        default: "data-platform-team"
        database:
          "finance_db": "finance-team"
          "marketing_db": "marketing-team"
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
