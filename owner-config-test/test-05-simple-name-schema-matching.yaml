# ============================================
# Test Case 5: Simple Name Schema Matching (Fallback)
# ============================================
# 测试场景：使用简单名称匹配 schema owners（测试 fallback 机制）
# 预期结果：
#   - 所有叫 "accounting" 的 schema → "accounting-team"
#   - 所有叫 "treasury" 的 schema → "treasury-team"
#   - 应该在日志中看到 INFO 级别的 "FQN match failed, matched using simple name"

source:
  type: postgres
  serviceName: postgres-finance-test-05
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: finance_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration
      ownerConfig:
        default: "data-platform-team"
        databaseSchema:
          "accounting": "accounting-team"    # 简单名称，会触发 fallback
          "treasury": "treasury-team"        # 简单名称，会触发 fallback
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
