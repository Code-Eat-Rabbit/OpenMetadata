# ============================================
# Test Case 11: Marketing Database Full Configuration
# ============================================
# 测试场景：测试 marketing_db 的完整配置
# 预期结果：
#   - marketing_db → "marketing-team"
#   - campaigns schema → ["marketing-team", "creative-team"]
#   - analytics schema → ["analytics-team", "data-science-team"]
#   - email_campaigns → ["marketing-team", "email-team"]
#   - social_media → ["marketing-team", "social-team"]
#   - customer_segments → "analytics-team"
#   - conversion_funnel → ["analytics-team", "marketing-team"]

source:
  type: postgres
  serviceName: postgres-marketing-test-11
  serviceConnection:
    config:
      type: Postgres
      username: admin
      authType:
        password: admin123
      hostPort: localhost:5433
      database: marketing_db
  sourceConfig:
    config:
      type: DatabaseMetadata
      
      # Owner Configuration
      ownerConfig:
        default: "data-platform-team"
        
        database:
          "marketing_db": "marketing-team"
        
        databaseSchema:
          "marketing_db.campaigns": ["marketing-team", "creative-team"]
          "marketing_db.analytics": ["analytics-team", "data-science-team"]
        
        table:
          "marketing_db.campaigns.email_campaigns": ["marketing-team", "email-team"]
          "marketing_db.campaigns.social_media": ["marketing-team", "social-team"]
          "marketing_db.analytics.customer_segments": "analytics-team"
          "marketing_db.analytics.conversion_funnel": ["analytics-team", "marketing-team"]
        
        enableInheritance: true
      
      includeTables: true
      includeViews: true
      markDeletedTables: true
      useFqnForFiltering: true
      overrideMetadata: true

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: DEBUG
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: "YOUR_JWT_TOKEN_HERE"
